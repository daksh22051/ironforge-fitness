<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>Admin Portal Login | IRONFORGE FITNESS</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F172A">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-slate: #0F172A;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --accent-red: #E02814;
      --accent-red-hover: #C5200E;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-slate);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle background glow effect */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(224, 40, 20, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: rgba(224, 40, 20, 0.15);
      border: 1px solid rgba(224, 40, 20, 0.4);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-red);
      margin-bottom: 0.75rem;
    }

    .brand-icon svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--accent-red);
      margin-top: 3px;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      padding: 2.25rem 2rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .card-subtitle {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: var(--font-main);
      font-size: 0.88rem;
      color: var(--text-primary);
      background-color: #F8FAFC;
      transition: all 0.15s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-red);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(224, 40, 20, 0.12);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--accent-red);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-family: var(--font-main);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s ease, transform 0.1s ease;
      margin-top: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-red-hover);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert-error {
      display: none;
      background-color: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    .alert-error.visible {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.76rem;
      color: #64748B;
    }

    .login-footer a {
      color: #94A3B8;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .login-footer a:hover {
      color: #FFFFFF;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem 0.75rem;
      }

      .brand-header {
        margin-bottom: 1.5rem;
      }

      .brand-title {
        font-size: 1.2rem;
      }

      .login-card {
        padding: 1.5rem 1.15rem;
        border-radius: 12px;
      }

      .card-title {
        font-size: 1.15rem;
      }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>

  <div class="login-container">
    
    <!-- Branding Header -->
    <div class="brand-header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 6h16v2H4V6zm1 3h14v2l-2 3H7L5 9zm4 6h6v4h3v2H6v-2h3v-4z"/>
        </svg>
      </div>
      <h1 class="brand-title">IRONFORGE FITNESS</h1>
      <span class="brand-badge">MANAGEMENT PORTAL</span>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <h2 class="card-title">Admin Sign In</h2>
      <p class="card-subtitle">Enter your credentials to access system management</p>

      <div class="alert-error" id="login-error" role="alert"></div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label for="admin-email" class="form-label">Admin Email Address</label>
          <input 
            type="email" 
            id="admin-email" 
            name="email" 
            class="form-input" 
            placeholder="admin@ironforgefitness.demo" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="admin-password" class="form-label">Password</label>
          <input 
            type="password" 
            id="admin-password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-submit" id="login-submit-btn">
          <span id="btn-text">Sign In to Dashboard</span>
        </button>
      </form>
    </div>

    <!-- Footer Note -->
    <div class="login-footer">
      <p>&larr; <a href="/">Back to Public Website</a></p>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // If already authenticated, redirect straight to /admin
      try {
        const check = await fetch('/api/admin/session');
        const data = await check.json();
        if (data.success && data.authenticated) {
          window.location.href = '/admin';
          return;
        }
      } catch (e) {}

      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('admin-email');
      const passwordInput = document.getElementById('admin-password');
      const submitBtn = document.getElementById('login-submit-btn');
      const btnText = document.getElementById('btn-text');
      const errorBox = document.getElementById('login-error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');
        errorBox.textContent = '';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          errorBox.textContent = 'Please enter both your email address and password.';
          errorBox.classList.add('visible');
          return;
        }

        submitBtn.disabled = true;
        btnText.textContent = 'Verifying Credentials...';

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const result = await response.json();

          if (response.ok && result.success) {
            btnText.textContent = 'Access Granted. Redirecting...';
            window.location.href = '/admin';
          } else {
            errorBox.textContent = result.error || 'Invalid credentials. Access denied.';
            errorBox.classList.add('visible');
            submitBtn.disabled = false;
            btnText.textContent = 'Sign In to Dashboard';
            passwordInput.value = '';
            passwordInput.focus();
          }
        } catch (err) {
          errorBox.textContent = 'Server connection error. Please try again.';
          errorBox.classList.add('visible');
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>
