<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>404 — Page Not Found | IRONFORGE FITNESS</title>
  <meta name="description" content="The page you are looking for does not exist. Return to IRONFORGE FITNESS homepage.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-slate: #0F172A;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --accent-red: #E02814;
      --accent-red-hover: #C5200E;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: #FAFAFA;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 3.5rem 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: rgba(224, 40, 20, 0.08);
      border: 1px solid rgba(224, 40, 20, 0.2);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-red);
      margin-bottom: 1.25rem;
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .error-code {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent-red);
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .error-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.85rem 1.75rem;
      background-color: var(--accent-red);
      color: #FFFFFF;
      font-family: var(--font-main);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(224, 40, 20, 0.25);
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      background-color: var(--accent-red-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(224, 40, 20, 0.35);
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 2.25rem 1.25rem;
      }
      .error-code {
        font-size: 2.8rem;
      }
      .error-title {
        font-size: 1.25rem;
      }
      .btn-home {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 6h16v2H4V6zm1 3h14v2l-2 3H7L5 9zm4 6h6v4h3v2H6v-2h3v-4z"/>
      </svg>
    </div>
    
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you are looking for might have been moved, renamed, or is temporarily unavailable. Let's get you back on track.</p>
    
    <a href="/" class="btn-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Back to Home
    </a>
  </div>

</body>
</html>
